<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<title>Pasupathi Van Sales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">பசுபதி பேக்கரி <small>Van Sales</small></div>
  <div class="date" id="topDate"></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="stock"><span class="ic">📦</span>இருப்பு<small>Stock</small></button>
  <button data-tab="deliver"><span class="ic">🛵</span>விநியோகம்<small>Deliver</small></button>
  <button data-tab="sales"><span class="ic">🧾</span>விற்பனை<small>Sales</small></button>
  <button data-tab="amount"><span class="ic">💰</span>வரவு<small>Amount</small></button>
  <button data-tab="more"><span class="ic">☰</span>மேலும்<small>More</small></button>
</nav>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
